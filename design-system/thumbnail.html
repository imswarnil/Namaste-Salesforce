<!DOCTYPE html><html><head><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}

.strip{width:120px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="wrap">
<div class="main"><div class="mark"><img src="assets/logo/favicon.svg"><span style="font-size:64px">Namaste Salesforce</span></div></div>
<div class="strip">
<div style="background:#7cbeff"></div>
<div style="background:#0176d3"></div>
<div style="background:#fe9339"></div>
<div style="background:#ea001e"></div>
</div>
</div>
</body></html>
