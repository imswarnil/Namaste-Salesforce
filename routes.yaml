# ════════════════════════════════════════════════════════════════════════════
# routes.yaml — Namaste Salesforce URL model
# ----------------------------------------------------------------------------
# Ghost reads this from content/settings/routes.yaml (upload in Admin →
# Settings → Labs → Routes, or copy + restart). It lives in the theme because
# the templates cannot be reasoned about without it.
#
# THE MODEL — three collections and a designed homepage:
#
#   /                      home.hbs      designed page (data: page.home)
#   /blog/                 blog.hbs      the writing        #blog-col
#   /blog/{slug}/          post.hbs      an article
#   /courses/              courses.hbs   the catalogue      #course-col
#   /courses/{slug}/       post.hbs      a course landing
#   /courses/{c}/{slug}/   post.hbs      a lesson (player)  #lesson-col
#   /training/             training.hbs  modules            #training-col
#   /training/{m}/{slug}/  post.hbs      a module page
#   /{slug}/               index.hbs     catch-all — no published post 404s
#   /llms.txt              llms.hbs      the site, described for machines
#
# THE RULES, all load-bearing:
#
# 1 · ONE INTERNAL TAG PER COLLECTION, filters below accept both the Namaste
#     vocabulary and the bright vocabulary already on imported content:
#       course   #course-col    (or #courses-col)
#       lesson   #lesson-col    (or #lessons-col)
#       training #training-col  (or #docs-col)
#       blog     #blog-col
#
# 2 · A COURSE'S SLUG EQUALS ITS PUBLIC TAG'S SLUG, and every lesson's PRIMARY
#     tag is that tag. That single equality is the whole parent/child
#     mechanism: it nests lesson URLs, finds the course from a lesson, lists
#     the curriculum, and keeps prev/next (in="primary_tag") inside the
#     course. Training works the same way, except the module is the TAG
#     itself — there is no parent post.
#
# 3 · THE CATCH-ALL IS LAST AND UNFILTERED, so a post matching no collection
#     still gets a URL instead of a silent 404.
# ════════════════════════════════════════════════════════════════════════════

routes:

  # A designed page, not a feed. data: page.home hangs the "home" page's
  # meta + code injection on the route — that page must exist.
  /:
    template: home
    data: page.home

  # Machine-readable site map (llmstxt.org), served as plain text.
  # /llms.txt itself is owned by Ghost 6's native handler (Settings →
  # llms_enabled) and can't be claimed by a route; this is the richer,
  # theme-curated version — courses with lessons, modules, navigation.
  /llms/:
    template: llms
    content_type: text/plain

  # The human-readable twin of the above: every collection, page and
  # topic on one page. (/sitemap.xml stays Ghost's.)
  /sitemap/:
    template: sitemap

  # Membership: real pages wrapping Ghost Portal's flows. Tiers,
  # prices and benefits are edited in Admin → Settings → Tiers.
  /signin/:
    template: signin
  /signup/:
    template: signup
  /membership/:
    template: membership

collections:

  # ── COURSES ──────────────────────────────────────────────────────────────
  /courses/:
    permalink: /courses/{slug}/
    template: courses
    data: page.courses
    filter: "tag:hash-course"
    order: published_at asc
    limit: 12

  # Hidden mount: exists only to mint nested lesson permalinks.
  /__lessons__/:
    permalink: /courses/{primary_tag}/{slug}/
    filter: "tag:hash-lesson"

  # ── TRAINING ─────────────────────────────────────────────────────────────
  # The module ({primary_tag}) does the nesting; training.hbs discovers the
  # modules themselves from the tags.
  /training/:
    permalink: /training/{primary_tag}/{slug}/
    template: training
    filter: "tag:hash-training"
    order: published_at asc
    limit: 100

  # ── BLOG ─────────────────────────────────────────────────────────────────
  /blog/:
    permalink: /blog/{slug}/
    template: blog
    data: page.blog
    filter: "tag:hash-blog"
    limit: 13

  # ── VIDEOS ───────────────────────────────────────────────────────────────
  # Standalone walkthroughs; each post opens on its embedded video.
  /videos/:
    permalink: /videos/{slug}/
    template: videos
    data: page.videos
    filter: "tag:hash-video"
    limit: 12

  # ── NEWSLETTER ───────────────────────────────────────────────────────────
  /newsletter/:
    permalink: /newsletter/{slug}/
    template: newsletter
    data: page.newsletter
    filter: "tag:hash-newsletter"
    limit: 12

  # ── CHANGELOG ────────────────────────────────────────────────────────────
  # Accepts bright's #feed-col so imported changelog entries route too.
  /changelog/:
    permalink: /changelog/{slug}/
    template: changelog
    data: page.changelog
    filter: "tag:hash-changelog"
    limit: 20

  # ── RESOURCES ────────────────────────────────────────────────────────────
  # Curated external + internal resources. Facets are internal tags
  # (#resource-type-*, #resource-free/-paid) surfaced as the filter
  # sidebar — filters.js builds it from the cards' data attributes.
  /resources/:
    permalink: /resources/{slug}/
    template: resources
    data: page.resources
    filter: "tag:hash-resource"
    limit: 24

  # ── SHOP ─────────────────────────────────────────────────────────────────
  # Digital assets: ebooks, notes, themes. Price is an internal tag's
  # DESCRIPTION (#shop-price-*), never parsed from a slug.
  /shop/:
    permalink: /shop/{slug}/
    template: shop
    data: page.shop
    filter: "tag:hash-shop"
    limit: 24

  # ── PROJECTS ─────────────────────────────────────────────────────────────
  # Open-source work, GitHub-styled. Language + stars are internal
  # tag DESCRIPTIONS (#project-lang-*, #project-stars-*), never
  # parsed from slugs.
  /projects/:
    permalink: /projects/{slug}/
    template: projects
    data: page.projects
    filter: "tag:hash-project"
    limit: 24

  # ── SNIPPETS ─────────────────────────────────────────────────────────────
  /snippets/:
    permalink: /snippets/{slug}/
    template: snippets
    data: page.snippets
    filter: "tag:hash-snippet"
    limit: 24

  # ── PROMPTS ──────────────────────────────────────────────────────────────
  /prompts/:
    permalink: /prompts/{slug}/
    template: prompts
    data: page.prompts
    filter: "tag:hash-prompt"
    limit: 24

  # ── CATCH-ALL ────────────────────────────────────────────────────────────
  /archive/:
    permalink: /{slug}/
    template: index
    limit: 12

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
