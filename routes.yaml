# ════════════════════════════════════════════════════════════════════════════
# routes.yaml — the URL model. The most expensive file in the theme to change.
# ----------------------------------------------------------------------------
# This is NOT part of the theme zip. Ghost stores it separately, and it is
# uploaded in Admin → Settings → Labs → Routes. It is committed here because
# the templates below cannot be reasoned about without it.
#
# ⚠⚠ RECONSTRUCTED, NOT DOWNLOADED — DIFF BEFORE YOU UPLOAD ⚠⚠
# This file was rebuilt to match the URLs the LIVE site is actually serving,
# reconstructed from two sources: the previous port's routes.yaml at git
# 206a211, and www.namastesalesforce.com/sitemap-*.xml. It has NOT been
# diffed against the file running in Ghost Admin, because that file can only
# be downloaded from Admin → Settings → Labs → Routes.
#
#   Download it and diff it against this BEFORE uploading anything. If they
#   disagree, the downloaded file is right and this one is wrong.
#
# ── WHY THIS FILE WAS REWRITTEN ─────────────────────────────────────────────
# The version replaced here (git 4b83f66) declared a URL model that the live
# site does not have, on a premise its own comments stated and that was false:
# "nothing is published yet". At the time of writing the site has published
# posts under /blog/, /courses/, /training/ and /archive/.
#
# Uploading that version would have:
#   · moved EVERY blog post from /blog/{slug}/ to /{slug}/, and
#   · deleted the /courses/, /lessons/, /docs/, /docs-pages/, /resources/ and
#     /archive/ collections outright, unrouting every post in them.
#
# That is a full migration with 301s and lost ranking, presented as a tidy-up.
# The rule in the header below is not decoration — it is the thing that was
# broken.
#
#   ⚠ Every URL on the site comes from this file. Changing a permalink after
#   publishing means 301-ing every page under it and losing whatever ranking
#   the old one had. Decide it in abstract/collections.md BEFORE the first
#   post — and where a post already exists, this file follows the post.
#
# THE RULE (abstract/decisions/0003): this file names ONLY templates that
# exist and are servable. Ghost does not validate a `template:` key — it
# silently falls back to index.hbs, so a typo here is a page that renders but
# renders wrong. Three of the templates named below did not exist until now,
# which is exactly how /courses/ and /docs/ came to be served as the blog.
# ════════════════════════════════════════════════════════════════════════════

routes:

  # The homepage is a STATIC ROUTE, not a collection index. It is a designed
  # page — hero, what shipped, latest, subscribe — and a collection index is a
  # paginated list. Mounting the catch-all here instead would make /page/2/
  # render the hero a second time, which is duplicate content with a different
  # URL, and the worst kind because it looks deliberate.
  /:
    template: home

  # ads.txt — authorised digital sellers, from the ads_txt theme setting.
  #
  # ⚠ ONLY REACHABLE AT /ads.txt/ — with the trailing slash. A bare GET
  # /ads.txt has a file extension, so Ghost's static-theme middleware hands it
  # to express.static with fallthrough:false and 404s it BEFORE this router
  # ever runs. Verified against the running site: both forms 404 without this
  # route, and only the trailing-slash form works with it.
  #
  # IAB crawlers request the bare path, so production needs a proxy REWRITE
  # (not a redirect — whether verifiers follow one is unverified):
  #   nginx:      location = /ads.txt { proxy_pass http://ghost/ads.txt/; }
  #   Cloudflare: rewrite /ads.txt -> /ads.txt/
  /ads.txt/:
    template: ads
    content_type: text/plain

collections:

  # ── COURSES — /courses/{slug}/, lessons nested beneath ────────────────────
  # PUBLISHED AND LIVE. template: courses is new (courses.hbs); until it was
  # written this index was served by index.hbs as a blog grid.
  /courses/:
    permalink: /courses/{slug}/
    template: courses
    filter: tag:hash-course

  # A lesson's PRIMARY tag IS its course's tag, so {primary_tag} does the
  # nesting on its own. Different path depth from the course above, so the two
  # cannot clash. THE ONE RULE applies: a course post's slug must equal its
  # own tag's slug, or these two do not line up.
  /lessons/:
    permalink: /courses/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-lesson

  # ── TRAINING — /training/{module}/{lesson}/ ───────────────────────────────
  # PUBLISHED AND LIVE: 3 sections and 14 lessons, verified through the
  # Content API against www.namastesalesforce.com.
  #
  # ⚠⚠ THE TAGS ARE NOT THE ONES THE REGISTRY NAMES ⚠⚠
  # The published posts carry #training-section and #training-content. The
  # canonical vocabulary in abstract/05-content/tag-registry.md, adopted in
  # decision 0004, is #training-module and #training-lesson. 0004 renamed
  # them on the stated premise that "the theme has no content yet" — false
  # then and false now — so the rename was recorded and never carried out.
  #
  # The filters below therefore match BOTH, using NQL's tag:[a,b] OR form,
  # and so does the dispatch in post.hbs. That is what makes the site correct
  # now without a content migration and still correct after one. Until the
  # retag happens the LIVE routes.yaml almost certainly filters on the old
  # names alone — which is another reason to diff before uploading.
  #
  # ⚠ The mount is /training-sections/, NOT /training/. /training/ is a
  # PAGE (Ghost page, slug `training`) that acts as the landing surface, per
  # tag-registry.md: "a landing page needs a route, not a tag".
  /training-sections/:
    permalink: /training/{slug}/
    template: training
    filter: tag:[hash-training-section,hash-training-module]

  /training-lessons/:
    permalink: /training/{primary_tag}/{slug}/
    template: index
    filter: tag:[hash-training-content,hash-training-lesson]

  # ── DOCS — /docs/{section}/{page}/ ────────────────────────────────────────
  # PUBLISHED AND LIVE. template: docs is new (docs.hbs); this index was
  # being served as a blog grid too.
  # ⚠ UNVERIFIED — the only published docs post is
  # /docs/documentation/say-namaste-to-salesforce/, which carries NO internal
  # tag at all (public tag `documentation`). So the live docs collection is
  # NOT filtering on #docs-section/#docs-page: zero posts carry either.
  # Whatever it filters on could not be determined from outside Ghost Admin.
  # These two entries are the CANONICAL model, kept so docs.hbs has something
  # coherent to be checked against — they are not a claim about production.
  /docs/:
    permalink: /docs/{slug}/
    template: docs
    filter: tag:hash-docs-section

  /docs-pages/:
    permalink: /docs/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-docs-page

  # ── BLOG — /blog/{slug}/ ──────────────────────────────────────────────────
  # ⚠ THE PERMALINK IS /blog/{slug}/ AND MUST STAY THAT WAY. Posts are
  # published at it. The replaced version of this file used /{slug}/, which
  # would have moved every one of them.
  # The feed is at /blog/rss/ — Ghost serves one per collection at <mount>rss/,
  # and the theme links it in blog.hbs, resources.hbs and the footer. If this
  # mount ever moves, `grep -rn "blog/rss" .` is the list of what moves with it.
  /blog/:
    permalink: /blog/{slug}/
    template: blog
    filter: tag:hash-blog

  # ── RESOURCES — /resources/{slug}/ ────────────────────────────────────────
  # PUBLISHED AND LIVE. template: resources is new (resources.hbs).
  /resources/:
    permalink: /resources/{slug}/
    template: resources
    filter: tag:hash-resource

  # ── THE CATCH-ALL, mounted at /archive/ ───────────────────────────────────
  # Unfiltered and LAST: every post lands here until a narrower collection
  # claims it. A filter here would make any post matching nothing unroutable —
  # a 404 on a published post, invisible until someone reports it.
  # Posts land at /{slug}/, which is why /archive/{post}/ does not appear in
  # any URL: the mount is the index, the permalink is the root.
  /archive/:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
