# routes.yaml — Namaste Salesforce
#
# Upload in Ghost Admin → Settings → Labs → Routes. This file is NOT read from
# the theme folder; it lives here so it is versioned with the templates that
# depend on it.
#
# ⚠ A ROUTE POINTING AT A MISSING TEMPLATE IS A 400, not a fallback — Ghost
# answers "Missing template {name}.hbs" and the page is dead. Every
# `template:` below names a file that ships with this theme. See
# abstract/decisions/0003.
#
# ── How the two-level URLs work ─────────────────────────────────────────────
# A COURSE is a tag, and its lessons are the posts carrying that tag as their
# PRIMARY tag. The course's own overview post has a slug equal to its tag's
# slug. From those two facts:
#
#     /courses/{slug}/                  the overview   (slug == tag)
#     /courses/{primary_tag}/{slug}/    its lessons, nested automatically
#
# The parent permalink uses {slug} rather than {primary_tag} because the
# parent SHARES its tag with every child — {primary_tag} would be ambiguous
# and Ghost would 301 to the wrong parent. Training sections and docs sections
# are the same shape. abstract/01 owns this model; it is the single most
# expensive thing here to change later.

routes:
  /: home

collections:
  # ── Courses ──────────────────────────────────────────────────────────────
  /courses/:
    permalink: /courses/{slug}/
    template: courses
    filter: tag:hash-course

  # The /lessons/ path is only this collection's archive index; the lesson
  # URLs themselves live under /courses/.
  /lessons/:
    permalink: /courses/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-lesson

  # ── Training ─────────────────────────────────────────────────────────────
  # The collection ROOT is /training/, which is also the parent of every
  # section's URL. Ghost is fine with that — /courses/ does the same — and it
  # puts the listing at the path a reader would guess, with no second route to
  # keep in step.
  /training/:
    permalink: /training/{slug}/
    template: training
    filter: tag:hash-training-module

  /training-lessons/:
    permalink: /training/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-training-lesson

  # ── Documentation ────────────────────────────────────────────────────────
  /docs/:
    permalink: /docs/{slug}/
    template: docs
    filter: tag:hash-docs-section

  /docs-pages/:
    permalink: /docs/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-docs-page

  # ── Flat collections ─────────────────────────────────────────────────────
  /blog/:
    permalink: /blog/{slug}/
    template: blog
    filter: tag:hash-blog

  /resources/:
    permalink: /resources/{slug}/
    template: resources
    filter: tag:hash-resource

  # Catch-all, and it MUST stay last. A post carrying none of the tags above
  # still needs a URL; without this it has none and 404s. Ghost matches
  # collections in order, so an unfiltered collection placed earlier would
  # swallow everything below it.
  /archive/:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
