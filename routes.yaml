# routes.yaml — Namaste Salesforce
#
# Upload in Ghost Admin → Settings → Labs → Routes. This file is NOT read from
# the theme folder; it lives here so it is versioned alongside the templates
# that depend on it.
#
# ⚠️ A ROUTE POINTING AT A MISSING TEMPLATE IS A 400, not a fallback. Ghost
# answers "Missing template {name}.hbs for route /x/" and the page is dead. So
# this file only ever contains routes the theme can actually serve.
#
# THIS IS THE STARTER SET. The full URL model — courses with nested lessons,
# training sections, docs, resources — is in abstract/01-content-model.md,
# with the literal YAML at the bottom of it. Move an entry back here in the
# same commit that adds its template, never before.

routes:
  # `/` needs home.hbs. index.hbs does NOT cover it: `/` is a routed template,
  # not the collection index.
  /: home

collections:
  # One collection for everything, until there is a reason for more. It gives
  # the index page, pagination, an RSS feed and {{#prev_post}}/{{#next_post}}
  # for free — see abstract/13.
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
