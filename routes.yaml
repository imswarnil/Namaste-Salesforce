# ════════════════════════════════════════════════════════════════════════════
# routes.yaml — the URL model. The most expensive file in the theme to change.
# ----------------------------------------------------------------------------
# NOT part of the theme zip. Ghost stores it separately; it is uploaded in
# Admin → Settings → Labs → Routes. Committed here because the templates
# cannot be reasoned about without it.
#
# ⚠⚠ DO NOT UPLOAD THIS UNTIL THE RETAG HAS RUN ⚠⚠
# It filters on the `-col` vocabulary. Published posts do not carry those tags
# until scripts/migrate-col-tags.mjs has been run against production. Upload
# it first and every post in every collection becomes unroutable — a 404 on
# published content. The order is: retag, verify, THEN upload.
#
#     node scripts/migrate-col-tags.mjs            # dry run, changes nothing
#     node scripts/migrate-col-tags.mjs --apply    # adds the -col tags
#
# The migration is ADDITIVE: it adds `#blog-col` beside `#blog` and removes
# nothing, so the old routes.yaml keeps working the whole time. That is what
# makes this safe to do while the site is live.
#
# ── THE ARCHITECTURE, FROM namaste-salesforce-bright ────────────────────────
# Three patterns, all of them earned:
#
# 1 · ONE `-col` TAG PER COLLECTION, and the names are BRIGHT'S OWN where
#     bright has the collection: courses-col, lessons-col, blog-col,
#     folders-col, docs-col. Not invented — the seeded content already carries
#     them, verified in the database. They are PLURAL for the child
#     collections and that is not cosmetic: #lessons-col is already owned by
#     courses' children, so training's children must be #training-lessons-col
#     or the two collections merge into one and every training lesson gets a
#     /courses/ URL.
#
# 2 · `data: page.x` ON EVERY COLLECTION. A real Ghost page backs each index
#     and supplies its meta title, description and social card. Without it an
#     index has no resource to hang metadata on and inherits the site's — which
#     is why every listing on this site currently shares one description.
#     ⚠ The page must EXIST or the route errors. Create all of them first.
#
# 3 · A HIDDEN MOUNT FOR EACH CHILD. `/__lessons__/` and `/__documents__/`
#     exist only to give children a `{primary_tag}/{slug}` permalink. The
#     mount itself is never linked; the underscores say so.
#
# THE RULE (abstract/decisions/0003): this file names ONLY templates that
# exist. Ghost does not validate a `template:` key — it falls back to
# index.hbs in silence, so a typo is a page that renders, and renders wrong.
# scripts/check-routes.mjs enforces it.
#
# THE OTHER RULE: a parent post's slug must equal its own tag's slug. That is
# what lets a parent use {slug} while its children use {primary_tag}/{slug}
# and still nest. Break it and the child sits under a URL its parent does not
# own — silently.
# ════════════════════════════════════════════════════════════════════════════

routes:

  # The homepage is a STATIC ROUTE, not a collection. It is a designed page,
  # and a collection index is a paginated list — mounting the catch-all here
  # would make /page/2/ render the hero again at a second URL.
  #
  # ⚠ bright mounts a COLLECTION at / filtered on #landing-col, so its
  # homepage is assembled from landing posts. That is a real option and it is
  # deliberately NOT taken: this homepage is composed in partials/home/, and
  # you said you would build it yourself. Nothing here forecloses it — swap
  # this block for a collection when you want the sections to be content.
  /:
    template: home

  /ads.txt/:
    template: ads
    content_type: text/plain

collections:

  # ── TRAINING — the docs shape, which is what you asked for ───────────────
  # A SECTION is a post whose body is the section overview; its LESSONS nest
  # beneath it. Exactly bright's folders → documents, renamed.
  /training/:
    permalink: /training/{slug}/
    template: training
    data: page.training
    filter: "tags:hash-training-sections-col"
    order: "published_at asc"
    limit: "100"

  # Hidden mount. A lesson's PRIMARY tag is its section's public tag, so
  # {primary_tag} does the nesting on its own.
  /__training-lessons__/:
    permalink: /training/{primary_tag}/{slug}/
    filter: "tags:hash-training-lessons-col"

  # ── COURSES ──────────────────────────────────────────────────────────────
  /courses/:
    permalink: /courses/{slug}/
    template: courses
    data: page.courses
    filter: "tags:hash-courses-col"

  /__lessons__/:
    permalink: /courses/{primary_tag}/{slug}/
    filter: "tags:hash-lessons-col"

  # ── DOCS ─────────────────────────────────────────────────────────────────
  /docs/:
    permalink: /docs/{slug}/
    template: docs
    data: page.docs
    filter: "tags:hash-folders-col"
    order: "published_at asc"
    limit: "100"

  /__documents__/:
    permalink: /docs/{primary_tag}/{slug}/
    filter: "tags:hash-docs-col"

  # ── BLOG ─────────────────────────────────────────────────────────────────
  # ⚠ THE PERMALINK IS /blog/{slug}/ AND MUST STAY THAT WAY. Posts are
  # published at it. The feed is at /blog/rss/ — Ghost serves one per
  # collection at <mount>rss/, and the theme links it in three places:
  # `grep -rn "blog/rss" .` is the list if this mount ever moves.
  /blog/:
    permalink: /blog/{slug}/
    template: blog
    data: page.blog
    filter: "tags:hash-blog-col"

  # ── RESOURCES ────────────────────────────────────────────────────────────
  /resources/:
    permalink: /resources/{slug}/
    template: resources
    data: page.resources
    filter: "tags:hash-resource-col"

  # ── THE CATCH-ALL, mounted at /archive/ ──────────────────────────────────
  # Unfiltered and LAST: every post lands here until a narrower collection
  # claims it. A filter here would make any post matching nothing unroutable —
  # a 404 on a published post, invisible until someone reports it.
  # Posts land at /{slug}/, which is why /archive/{post}/ appears in no URL.
  /archive/:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
