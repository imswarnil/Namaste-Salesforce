# ════════════════════════════════════════════════════════════════════════════
# routes.yaml — the URL model. The most expensive file in the theme to change.
# ----------------------------------------------------------------------------
# This is NOT part of the theme zip. Ghost stores it separately, and it is
# uploaded in Admin → Settings → Labs → Routes. It is committed here because
# the templates below cannot be reasoned about without it.
#
#   ⚠ Every URL on the site comes from this file. Changing a permalink after
#   publishing means 301-ing every page under it and losing whatever ranking
#   the old one had. Decide it in abstract/collections.md BEFORE the first post.
#
# THE RULE (abstract/decisions/0003): this file names ONLY templates that
# exist and are servable. Ghost does not validate a `template:` key — it
# silently falls back to index.hbs, so a typo here is a page that renders but
# renders wrong.
# ════════════════════════════════════════════════════════════════════════════

routes:

  # The homepage is a STATIC ROUTE, not a collection index. It is a designed
  # page — hero, what shipped, latest, subscribe — and a collection index is a
  # paginated list. Mounting the catch-all here instead would make /page/2/
  # render the hero a second time, which is duplicate content with a different
  # URL, and the worst kind because it looks deliberate.
  /:
    template: home

  # /training/ — the curriculum's landing page.
  #
  # CONTENT-LESS ROUTE. There is ONE training, so nothing backs it: the page
  # lists the module POSTS discovered by the /training-modules/ collection
  # below. A Ghost PAGE with slug `training` supplies the title and excerpt if
  # one exists — training.hbs forks on {{#page}}.
  /training/:
    template: training

  # ads.txt — authorised digital sellers, from the ads_txt theme setting.
  #
  # ⚠ ONLY REACHABLE AT /ads.txt/ — with the trailing slash. A bare GET
  # /ads.txt has a file extension, so Ghost's static-theme middleware hands it
  # to express.static with fallthrough:false and 404s it BEFORE this router
  # ever runs. Verified against the running site: both forms 404 without this
  # route, and only the trailing-slash form works with it.
  #
  # IAB crawlers request the bare path, so production needs a proxy REWRITE
  # (not a redirect — whether verifiers follow one is unverified):
  #   nginx:      location = /ads.txt { proxy_pass http://ghost/ads.txt/; }
  #   Cloudflare: rewrite /ads.txt -> /ads.txt/
  /ads.txt/:
    template: ads
    content_type: text/plain

collections:

  # THE BLOG, mounted at /blog/ — and it is still the catch-all.
  #
  # ⚠ THE MOUNT MOVED, /archive/ → /blog/. THE PERMALINK DID NOT.
  # Posts stay at /{slug}/, so not one post URL changes and there is nothing
  # to 301. What moved is where the INDEX lives, and that was safe to move
  # only because nothing is published yet — this is exactly the "decide it
  # before the first post" window the header of this file describes. After
  # the first post it would have been a migration.
  #
  # ⚠ AND SO DID THE FEED: /archive/rss/ → /blog/rss/. Ghost serves one feed
  # per collection at <mount>rss/, so moving the mount moves the feed with
  # it. Every link in the theme was grepped and updated in the same change —
  # if this mount moves again, `grep -rn "blog/rss" .` is the list.
  #
  # Unfiltered and LAST: every post lands here until a narrower collection
  # claims it. A filter here would make any post matching nothing unroutable —
  # a 404 on a published post, invisible until someone reports it.
  # ── Training MODULES — /training/{module}/ ───────────────────────────────
  # A module is a POST tagged #training-module whose PRIMARY tag is the module
  # tag; its body is the module overview. Implemented from the spec already
  # written in abstract/01-content-model.md — read that before changing this.
  #
  # THE ONE RULE: the module post's SLUG must equal its primary TAG's slug.
  # The permalink uses {slug} (unique per post) rather than {primary_tag},
  # because the module post and every one of its lessons SHARE that tag —
  # {primary_tag} would be ambiguous and Ghost would 301 to the wrong place.
  # slug == tag slug is what makes /training/start/ (the module) and
  # /training/start/{lesson}/ (its lessons) line up.
  #
  # Adding a module is therefore Ghost-Admin-only: make the tag, write the
  # post with a matching slug, publish. No routes.yaml edit, no theme edit.
  # ORDER is published_at asc — backdate a module post to move it earlier.
  /training-modules/:
    permalink: /training/{slug}/
    template: training-module
    filter: tag:hash-training-module

  # Training LESSONS nest under their module: /training/{module}/{lesson}/
  # A lesson's PRIMARY tag IS its module's tag, so {primary_tag} does the
  # nesting on its own. Different path depth from the module above, so the two
  # cannot clash.
  /training-lessons/:
    permalink: /training/{primary_tag}/{slug}/
    template: index
    filter: tag:hash-training-lesson

  /blog/:
    permalink: /{slug}/
    template: blog

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
