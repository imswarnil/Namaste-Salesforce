name: Deploy Theme
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'design-system/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TryGhost/action-deploy-theme@v1
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          exclude: 'design-system/* AGENTS.md CLAUDE.md NEXT.md NAMASTE-SALESFORCE.md dummy-content/*'
