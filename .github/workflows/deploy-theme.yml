name: Deploy Theme
on:
  push:
    branches:
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Strip repo furniture so only the theme itself is uploaded. Docs and
      # fixtures do not belong in a deployed theme and can trip Ghost's upload
      # validation. `-rf`/`-f` are used throughout so this stays correct as
      # paths come and go; a missing path must not fail the deploy.
      #
      # routes.yaml is pruned deliberately: it is versioned here, but Ghost
      # reads it from Admin → Labs → Routes, NOT from the theme folder.
      - name: Prune non-theme files
        run: |
          rm -rf .claude abstract prompt scripts dummy-content styleguide
          rm -f ./*.md routes.yaml
          rm -f assets/built/*.map

      - name: Deploy Ghost Theme
        uses: TryGhost/action-deploy-theme@v1
        # The v1 action targets Node 20; GitHub runners now default to Node 24.
        # Allow it to run on its bundled Node until a Node-24 build ships.
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
