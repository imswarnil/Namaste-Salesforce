name: CI

# There is no build step yet — no stack has been chosen (see abstract/15).
# What CI can still do is what Ghost itself does on upload: validate the theme.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: gscan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:ci

      - name: No inline styles in templates
        run: |
          if grep -rn 'style="' --include='*.hbs' . --exclude-dir=node_modules; then
            echo "::error::Inline styles are not allowed. See abstract/05."
            exit 1
          fi
