name: Release

# Tag a version, get a release with an installable zip attached.
#
#   git tag -a v0.2.0 -m "…" && git push origin v0.2.0
#
# The zip is what a site owner uploads in Ghost Admin → Design → Change theme,
# so it must contain the theme and nothing else.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      - run: yarn test:ci

      - name: Package the theme
        run: yarn zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Install: download the zip below, then **Ghost Admin → Design → Change theme → Upload**.

            See [CHANGELOG.md](CHANGELOG.md) for what changed and whether this release is a breaking one.
