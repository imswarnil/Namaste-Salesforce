name: Feature request
description: Suggest something the theme should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening this — `abstract/11-theme-roadmap.md` lists what is
        already planned and, just as usefully, what this theme deliberately
        will **not** do. Worth a look; it may already be there.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution. "Readers cannot find X" beats "add a search box".
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
  - type: checkboxes
    id: checks
    attributes:
      label: Please confirm
      options:
        - label: This belongs in the THEME, not in the design system (NSDS) or the app
        - label: I checked `abstract/11-theme-roadmap.md`
