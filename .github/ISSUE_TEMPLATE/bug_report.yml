name: Bug report
description: Something in the theme renders or behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The most useful bug report says what you saw, on
        which page type, and what you expected instead.
  - type: dropdown
    id: surface
    attributes:
      label: Which page type?
      options:
        - Home
        - Course (single)
        - Course lesson
        - Training section
        - Training lesson
        - Blog post / listing
        - Documentation
        - Other / not sure
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: The curriculum rail shows every module open instead of just the current one.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How can we see it?
      description: A URL is ideal. Otherwise, the tags on the post and the steps to reach it.
    validations: { required: true }
  - type: input
    id: ghost
    attributes:
      label: Ghost version
      placeholder: "5.x"
  - type: textarea
    id: env
    attributes:
      label: Browser, device, light or dark mode
      description: Dark mode and mobile are where most theme bugs live, so please say which you were in.
