<svg xmlns="http://www.w3.org/2000/svg" viewBox="410 55 770 550" font-family="sans-serif">
<style>
  .bob1{animation:bob 4.2s ease-in-out infinite}
  .bob2{animation:bob 5s ease-in-out .7s infinite}
  .bob3{animation:bob 4.6s ease-in-out 1.3s infinite}
  .bob4{animation:bob 5.4s ease-in-out .4s infinite}
  .bob5{animation:bob 6s ease-in-out 1.8s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .flow{animation:dash 7s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-140}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .load{transform-box:fill-box;transform-origin:left center;animation:load 4s ease-in-out infinite alternate}
  @keyframes load{from{transform:scaleX(.25)}to{transform:scaleX(.85)}}
  .blink{animation:blink 3.2s ease-in-out infinite}
  @keyframes blink{0%,60%,100%{opacity:1}75%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
